description: |
  Agentic document intelligence platform — multi-agent LangGraph + Qwen on AMD MI300X. AMD Hackathon × lablab.ai. Agentic document intelligence on AMD MI300X Multi-document due diligence with deterministic compliance rules and a 6-layer anti-hallucination stack. Built for the AMD Developer Hackathon × lablab.ai (May 2026). PaperHawk is an agentic multi-document intelligence platform for auditors, lawyers, tax advisors, and DD analysts. It processes 3–50 PDFs simultaneously and detects cross-document red flags humans miss — like a 57.5% price drift across three invoices from the same supplier — using a multi-agent LangGraph orchestration on top of Qwen 2.5 14B Instruct served via vLLM on AMD Instinct MI300X. Primary language: python; ships a container definition; observed outbound integrations: api-inference.huggingface.co, self-hosted inference.
